services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["media", "all"]
    networks:
      - t3_proxy
    # ports:
    #   - 5055:5055
    user: "$PUID:$PGID"
    environment:
      TZ: $TZ
      LOG_LEVEL: info
      PORT: 5055
    volumes:
      - $DOCKERDIR/appdata/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      # UI router — protected by Authelia
      - "traefik.http.routers.seerr-rtr.entrypoints=websecure-internal,websecure-external"
      - "traefik.http.routers.seerr-rtr.rule=Host(`seerr.$DOMAINNAME_1`)"
      - "traefik.http.routers.seerr-rtr.priority=10"
      - "traefik.http.routers.seerr-rtr.middlewares=chain-authelia@file"
      - "traefik.http.routers.seerr-rtr.service=seerr-svc"
      # API router — no auth (for Sonarr/Radarr/notification integrations)
      - "traefik.http.routers.seerr-api-rtr.entrypoints=websecure-internal,websecure-external"
      - "traefik.http.routers.seerr-api-rtr.rule=Host(`seerr.$DOMAINNAME_1`) && PathPrefix(`/api`)"
      - "traefik.http.routers.seerr-api-rtr.priority=20"
      - "traefik.http.routers.seerr-api-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.seerr-api-rtr.service=seerr-svc"
      # Service
      - "traefik.http.services.seerr-svc.loadbalancer.server.port=5055"
